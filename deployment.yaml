apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-add-sa
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::XXXXXXXX:role/pod-add
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-add-app
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      serviceAccountName: app-add-sa
      containers:
        - name: my-app
          image: XXXXXXX.dkr.ecr.us-east-1.amazonaws.com/dockerimage
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: app-add-svc
  namespace: app
spec:
  selector:
    app: app1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP

